# BMU Messages — Runtime Configuration
#
# type_name format: <package>.<MessageName>  (must match .proto package + message name)
#
# Node IDs used in this configuration:
#   9999 — App / test tool (client)
#   1 — BMU (server)
#
# s_id default in each message is the *sender's* node ID.
# d_id default is the *intended receiver's* node ID.

messages:
  bmu.BmuStatus:
    meta:
      cycle_time_ms: 100
      enabled: true
      decode: true
      simulate: false

    fields:
      s_id:
        value: 1
        meta:
          min: 0
          max: 4294967295
          enable: true

      d_id:
        value: 9999
        meta:
          min: 0
          max: 4294967295
          enable: true

      hsm_state:
        value: 0
        meta:
          min: 0
          max: 4294967295
          enable: true

